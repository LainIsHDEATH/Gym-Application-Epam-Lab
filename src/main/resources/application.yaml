server:
  port: 8080

spring:
  application:
    name: gym-application

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  cloud:
    openfeign:
      client:
        config:
          trainer-workload-service:
            connect-timeout: 1000
            read-timeout: 3000


security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    service-token-expiration-minutes: ${JWT_SERVICE_TOKEN_EXPIRATION_MINUTES:5}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkloadService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

  health:
    circuitbreakers:
      enabled: true