server:
  port: 8080

spring:
  application:
    name: gym-application

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jms:
    template:
      qos-enabled: true
      delivery-mode: persistent

messaging:
  queues:
    trainer-workload: trainer.workload.queue

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    service-token-expiration-minutes: ${JWT_SERVICE_TOKEN_EXPIRATION_MINUTES:5}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true