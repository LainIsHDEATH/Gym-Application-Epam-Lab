eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/gym_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    service-token-expiration-minutes: ${JWT_SERVICE_TOKEN_EXPIRATION_MINUTES:5}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    root: INFO
    ua.ivan.epam.gym.application: DEBUG
    org.hibernate.SQL: INFO